<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Secret Wallet</title>
  <link rel="stylesheet" href="style.css">
  <!-- ボタンのアイコン用にFontAwesomeを読み込み -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1>🤫 My Secret Wallet</h1>
    
    <div class="summary-box">
      <h2>総資産額（切り捨て）</h2>
      <p id="total-yen" class="total-amount">0円</p>
    </div>

    <!-- 各サービスの詳細一覧 -->
    <div id="service-list" class="service-list">
      <!-- ここにJSで各サービスの金額が追加されます -->
    </div>

    <!-- 登録フォーム -->
    <div class="form-box">
      <h2>取引を記録する</h2>
      <select id="service-select">
        <option value="現金">現金</option>
        <option value="PayPay">PayPay</option>
        <option value="楽天PAY">楽天PAY</option>
        <option value="TikTok-Lite">TikTok-Lite</option>
        <option value="ポイム">ポイム</option>
        <option value="トリマ">トリマ</option>
        <option value="マクロミル">マクロミル</option>
        <option value="レシチャレ">レシチャレ</option>
        <option value="Uvoice">Uvoice</option>
      </select>
      
      <input type="number" id="point-input" placeholder="ポイント数 (マイナスも可)">
      <input type="text" id="memo-input" placeholder="メモ (例: TikTokからPayPayへ交換)">
      
      <!-- 教えてもらった最高なデザインのボタン -->
      <div class="button_solid016" style="margin-top: 20px;">
        <a href="#" onclick="addTransaction(); return false;">
          登録する<i class="fas fa-angle-right fa-position-right"></i>
        </a>
      </div>
    </div>
    
    <!-- 履歴一覧 -->
    <div class="history-box">
      <h2>取引履歴</h2>
      <ul id="history-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
