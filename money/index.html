<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY WALLET (Secret)</title>
  <style>
    /* AIっぽさを排除した超シンプルなデザイン */
    body {
      font-family: monospace, sans-serif;
      color: #333;
      background-color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1, h2 {
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    /* 残高一覧のテーブル */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f0f0f0;
    }
    /* フォーム周り */
    .form-box {
      border: 1px solid #333;
      padding: 15px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: inline-block;
      width: 120px;
    }
    input, select {
      padding: 5px;
      border: 1px solid #999;
    }
    button {
      background-color: #333;
      color: #fff;
      border: none;
      padding: 8px 15px;
      cursor: pointer;
    }
    button:hover {
      background-color: #555;
    }
    .details {
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>資産一覧</h1>
    
    <table>
      <thead>
        <tr>
          <th>サービス名</th>
          <th>現在のポイント</th>
          <th>円換算 (ざっくり)</th>
          <th>円換算 (細かく)</th>
        </tr>
      </thead>
      <tbody id="balance-table-body">
        <!-- ここにJavaScriptで残高が入ります -->
      </tbody>
    </table>

    <h2>記録する (入出金・交換)</h2>
    <div class="form-box">
      <div class="form-group">
        <label>日付:</label>
        <input type="date" id="input-date" required>
      </div>
      <div class="form-group">
        <label>サービス:</label>
        <select id="input-platform">
          <option value="cash">現金</option>
          <option value="paypay">PayPay</option>
          <option value="rakuten">楽天PAY</option>
          <option value="tiktok_lite">TikTok-Lite</option>
          <option value="poimu">ポイム</option>
          <option value="torima">トリマ</option>
          <option value="macromill">マクロミル</option>
          <option value="reshichare">レシチャレ</option>
          <option value="uvoice">Uvoice</option>
        </select>
      </div>
      <div class="form-group">
        <label>増減:</label>
        <select id="input-type">
          <option value="plus">＋ 増えた (稼いだ/交換先)</option>
          <option value="minus">－ 減った (使った/交換元)</option>
        </select>
      </div>
      <div class="form-group">
        <label>ポイント数:</label>
        <input type="number" id="input-amount" placeholder="例: 1000" required>
      </div>
      <div class="form-group">
        <label>メモ(自由記述):</label>
        <input type="text" id="input-memo" placeholder="例: PayPayに交換" style="width: 250px;">
      </div>
      <button onclick="addTransaction()">記録を保存</button>
    </div>

    <h2>履歴</h2>
    <table>
      <thead>
        <tr>
          <th>日付</th>
          <th>サービス</th>
          <th>増減</th>
          <th>ポイント</th>
          <th>メモ</th>
        </tr>
      </thead>
      <tbody id="history-table-body">
        <!-- 履歴がここに入ります -->
      </tbody>
    </table>
  </div>

  <script>
    // 各サービスの1ポイントあたりの円レート
    const rates = {
      'cash': 1,
      'paypay': 0.01,
      'rakuten': 1,
      'tiktok_lite': 0.01,
      'poimu': 100 / 11000,
      'torima': 190 / 24000,
      'macromill': 273 / 300,
      'reshichare': 300 / 33000,
      'uvoice': 100 / 1050
    };

    // 表示用のサービス名
    const platformNames = {
      'cash': '現金', 'paypay': 'PayPay', 'rakuten': '楽天PAY',
      'tiktok_lite': 'TikTok-Lite', 'poimu': 'ポイム', 'torima': 'トリマ',
      'macromill': 'マクロミル', 'reshichare': 'レシチャレ', 'uvoice': 'Uvoice'
    };

    // データの保存先（今回はブラウザのlocalStorageを使用）
    let transactions = JSON.parse(localStorage.getItem('secret_wallet_data')) || [];

    // 今日の日付をセット
    document.getElementById('input-date').valueAsDate = new Date();

    // 記録を追加する関数
    function addTransaction() {
      const date = document.getElementById('input-date').value;
      const platform = document.getElementById('input-platform').value;
      const type = document.getElementById('input-type').value;
      const amount = Number(document.getElementById('input-amount').value);
      const memo = document.getElementById('input-memo').value;

      if (!date || !amount) {
        alert("日付とポイント数は入力してね！");
        return;
      }

      transactions.push({ id: Date.now(), date, platform, type, amount, memo });
      localStorage.setItem('secret_wallet_data', JSON.stringify(transactions));
      
      // フォームをリセットして再描画
      document.getElementById('input-amount').value = '';
      document.getElementById('input-memo').value = '';
      render();
    }

    // 画面を描画する関数
    function render() {
      // 1. 各サービスの残高を計算
      let balances = {};
      Object.keys(rates).forEach(k => balances[k] = 0);

      transactions.forEach(t => {
        if (t.type === 'plus') balances[t.platform] += t.amount;
        if (t.type === 'minus') balances[t.platform] -= t.amount;
      });

      // 2. 残高テーブルを描画
      const balanceBody = document.getElementById('balance-table-body');
      balanceBody.innerHTML = '';
      
      for (const [key, pt] of Object.entries(balances)) {
        const exactYen = pt * rates[key];
        const floorYen = Math.floor(exactYen);
        
        balanceBody.innerHTML += `
          <tr>
            <td><strong>${platformNames[key]}</strong></td>
            <td>${pt.toLocaleString()} pt</td>
            <td style="font-size: 1.2em; font-weight: bold;">${floorYen.toLocaleString()} 円</td>
            <td class="details">${exactYen.toFixed(4)} 円</td>
          </tr>
        `;
      }

      // 3. 履歴テーブルを描画
      const historyBody = document.getElementById('history-table-body');
      historyBody.innerHTML = '';
      
      // 新しい順に並び替え
      const sorted = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
      
      sorted.forEach(t => {
        const sign = t.type === 'plus' ? '＋' : '－';
        historyBody.innerHTML += `
          <tr>
            <td>${t.date}</td>
            <td>${platformNames[t.platform]}</td>
            <td>${sign}</td>
            <td>${t.amount.toLocaleString()} pt</td>
            <td>${t.memo}</td>
          </tr>
        `;
      });
    }

    // 最初に1回描画する
    render();
  </script>
</body>
</html>
