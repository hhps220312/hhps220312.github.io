<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三井はじ友銀行</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="logo">三井はじ友銀行</div>
        <!-- 別窓で開いている前提なので window.close() を実行 -->
        <a href="#" class="close-btn" onclick="window.close(); return false;">トップページに戻る</a>
    </header>

    <main>
        <!-- 口座残高エリア -->
        <section class="total-balance-section">
            <h2>口座残高： <span id="total-balance-amount">0</span> 円</h2>
            <div class="account-grid" id="account-grid">
                <!-- JavaScriptで口座一覧を出力します -->
            </div>
        </section>

        <!-- メインコンテンツ（左：履歴、右：入力） -->
        <div class="content-wrapper">
            <!-- 左側：取引履歴 -->
            <section class="history-section">
                <div class="history-header">
                    <h2>取引履歴</h2>
                    <select id="history-month-select"></select>
                </div>
                <div class="history-card">
                    <h3 id="history-current-month-display">2026年8月</h3>
                    <div class="history-list-container">
                        <table class="history-table" id="history-table">
                            <!-- JavaScriptで履歴を出力します -->
                        </table>
                    </div>
                </div>
            </section>

            <!-- 右側：取引登録 -->
            <section class="form-section">
                <div class="toggle-buttons">
                    <button type="button" id="btn-deposit" class="type-btn active">お預入れ</button>
                    <button type="button" id="btn-withdraw" class="type-btn">お引出し</button>
                </div>
                <div class="form-card">
                    <form id="transaction-form">
                        <div class="form-group">
                            <label>お日にち</label>
                            <div class="date-selects">
                                <select id="input-year"></select> 年
                                <select id="input-month"></select> 月
                                <select id="input-day"></select> 日
                            </div>
                        </div>

                        <div class="form-group">
                            <label>口座</label>
                            <select id="input-account"></select>
                        </div>

                        <div class="form-group">
                            <label>金額</label>
                            <div class="amount-input-wrapper">
                                <input type="number" id="input-amount" required>
                                <span id="unit-label">円</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>内容</label>
                            <textarea id="input-memo" rows="3"></textarea>
                        </div>

                        <button type="submit" class="submit-btn">登録する</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <!-- モーダル（詳細表示用） -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content" id="modal-content">
            <h3 id="modal-title">口座名</h3>
            <div class="modal-body">
                <p>現在のポイント数: <strong id="modal-pts">0 Pt</strong></p>
                <p>正確な円換算: <strong id="modal-yen">0.000 円</strong></p>
            </div>
            <p class="modal-hint">※枠外をタップして閉じる</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
