<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時刻表ジェネレーター</title>
<style>
  body { font-family: sans-serif; background: #f4f1ea; padding: 20px; color: #333; }
  .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 2px solid #333; }
  h2 { font-size: 18px; border-bottom: 2px dashed #ccc; padding-bottom: 8px; margin-top: 0; }
  input, select, button { padding: 8px; margin: 5px; border-radius: 4px; border: 1px solid #ccc; }
  button { background: #4a90e2; color: white; border: none; cursor: pointer; font-weight: bold; }
  button:hover { background: #357abd; }
  .route-group { border: 1px solid #eee; padding: 10px; margin-bottom: 10px; background: #fafafa; }
  .time-input { width: 70px; }
  .stop-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .stop-name { width: 150px; font-weight: bold; }
  #output-code { width: 100%; height: 300px; font-family: monospace; white-space: pre; overflow-x: auto; background: #f8f9fa; border: 1px solid #ccc; padding: 10px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 10px 20px; border-radius: 4px; display: none; }
</style>
</head>
<body>

<h1>時刻表ジェネレーター（データ登録画面）</h1>

<div class="card">
  <h2>1. 基本ルート（徒歩・単一区間）の所要時間設定</h2>
  <div id="walk-times-container"></div>
  <button onclick="saveWalkTimes()">徒歩時間を保存（Firebaseへ）</button>
</div>

<div class="card">
  <h2>2. 路線・系統の登録（バス・JR・地下鉄）</h2>
  <select id="line-type">
    <option value="bus">神姫バス / 市バス</option>
    <option value="jr">JR神戸線</option>
    <option value="subway">神戸市営地下鉄</option>
  </select>
  <input type="text" id="line-name" placeholder="例: 神姫バス 2系統">
  <input type="text" id="line-stops" placeholder="停車駅をカンマ区切り (例: 大久保駅,高丘西口,中央センター前)" style="width: 400px;">
  <button onclick="registerLine()">路線を登録</button>
</div>

<div class="card">
  <h2>3. 時刻（便）の登録</h2>
  <select id="select-line" onchange="loadLineStops()">
    <option value="">▼路線を選択してください</option>
  </select>
  
  <div id="time-entry-container" style="margin-top: 15px; display: none;">
    <h3>時刻入力（形式: 07:15）※通過しない場合は空欄</h3>
    <div id="stops-inputs"></div>
    <div id="train-type-container" style="display:none; margin-top: 10px;">
      種別: 
      <select id="train-type">
        <option value="local">普通</option>
        <option value="rapid">快速</option>
        <option value="special">新快速</option>
      </select>
    </div>
    <button onclick="saveTimetableEntry()" style="background: #50e3c2; color: black; margin-top: 15px;">この便を保存</button>
  </div>
  
  <div id="registered-entries" style="margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px;">
    <h3>登録済みの便</h3>
    <ul id="entries-list"></ul>
  </div>
</div>

<div class="card">
  <h2>4. transit.js 用コード生成</h2>
  <p>Firebaseに保存されたデータから、乗換案内のロジックコードを生成します。</p>
  <button onclick="generateCode()" style="background: #ff5a5f;">コードを生成する</button>
  <textarea id="output-code" readonly placeholder="ここに生成されたコードが出力されます"></textarea>
</div>

<div id="toast" class="toast">保存しました</div>

<script type="module" src="generator.js"></script>
</body>
</html>
