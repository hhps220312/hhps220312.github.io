        <div id="seconds" class="seconds">--秒</div>
      </div>

      <div class="button-grid">
        <div class="button_solid016">
          <a href="">リロード<i class="fas fa-angle-right"></i></a>
        </div>
        <div class="button_solid016">

        </div>
        <div class="button_solid016">
          <a href="https://github.com/login" target="_blank">Github<i class="fas fa-angle-right"></i></a>
        </div>
        <div class="button_solid016">
          <a href="https://calendar.google.com/calendar" target="_blank">カレンダー<i class="fas fa-angle-right"></i></a>
        </div>

        </div>
        <div class="button_solid016">
          <a href="https://gemini.google.com/app" target="_blank">Gemini<i class="fas fa-angle-right"></i></a>
        </div>
        <div class="button_solid016">
          <a href="https://www.instagram.com/?hl=ja" target="_blank">Instagram<i class="fas fa-angle-right"></i></a>
        </div>
        <div class="button_solid016">
          <a href="https://www.youtube.com/" target="_blank">YouTube<i class="fas fa-angle-right"></i></a>
        </div>
        <div class="button_solid016">
          <a href="https://learn.studysapuri.jp/ja/login" target="_blank">スタサプ<i class="fas fa-angle-right"></i></a>
        </div>
        <div class="button_solid016">

        </div>
      </div>
    </div>

    <div class="right-container">
      
      <!-- カレンダー上部にログイン・ログアウトと打刻ボタンを配置 -->
      <div class="top-controls">
        <div class="auth-buttons">
          <div class="button_solid016 btn-green">
            <a href="https://accounts.google.com/v3/signin/identifier?authuser=0&continue=https://myaccount.google.com/?pli%3D1&dsh=S-635098599:1786517646601416&ec=GAlAwAE&hl=ja&flowName=GlifWebSignIn&flowEntry=AddSession" target="_blank">ログイン<i class="fas fa-angle-right"></i></a>
          </div>
          <div class="button_solid016 btn-red">
            <a href="https://accounts.google.com/logout" target="_blank">ログアウト<i class="fas fa-angle-right"></i></a>
          </div>
        </div>

        <div class="action-buttons">
          <button class="action-btn" onclick="recordWake()">起床</button>
          <button class="action-btn" onclick="recordSleep()">就寝</button>
          <button class="action-btn" onclick="recordGoSchool()">登校</button>
          <button class="action-btn" onclick="recordLeaveSchool()">下校</button>
