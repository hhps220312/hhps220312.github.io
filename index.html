<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>はじめシステム</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dashboard">
    <header class="header">
      <div class="title-area">
        <h1>HAJIME SYSTEM</h1>
        <div class="auth-buttons">
          <a href="https://accounts.google.com/v3/signin/identifier?authuser=0&continue=https://myaccount.google.com/?pli%3D1&dsh=S-635098599:1786517646601416&ec=GAlAwAE&hl=ja&flowName=GlifWebSignIn&flowEntry=AddSession" target="_blank" class="btn-auth login">Google Login</a>
          <a href="https://accounts.google.com/logout" target="_blank" class="btn-auth logout">Logout</a>
        </div>
      </div>
      <div class="clock-area">
        <div id="clock" class="time"></div>
        <div id="seconds" class="seconds"></div>
      </div>
    </header>

    <main class="grid-container">
      <section class="panel timecard-panel">
        <h2>Time Card</h2>
        <div class="timecard-grid">
          <button onclick="recordWake()" class="card-btn wake">起床</button>
          <button onclick="recordSleep()" class="card-btn sleep">就寝</button>
          <button onclick="recordGoSchool()" class="card-btn go-school">登校</button>
          <button onclick="recordLeaveSchool()" class="card-btn leave-school">下校</button>
        </div>
      </section>

      <section class="panel transit-panel">
        <h2>Transit Info</h2>
        <div class="transit-controls">
          <select id="route-select">
            <option value="to_school">自宅 ➔ 学校</option>
            <option value="to_home">学校 ➔ 自宅</option>
          </select>
          <button onclick="calculateTransit()" class="transit-btn">検索</button>
        </div>
        <div id="transit-result" class="transit-result">
          <div class="bus-info">
            <span class="route-badge">推奨ルート</span>
            <p id="transit-detail">ルートを選択して検索してください。</p>
          </div>
        </div>
      </section>

      <section class="panel photo-panel">
        <div class="slider-container">
          <img id="slide-img" src="fire/001.jpg" alt="Favorite">
          <button class="slide-nav prev" onclick="changeSlide(-1)">&#10094;</button>
          <button class="slide-nav next" onclick="changeSlide(1)">&#10095;</button>
        </div>
      </section>

      <section class="panel todo-panel">
        <h2>To-Do List</h2>
        <div class="todo-input-area">
          <input type="text" id="todo-task" placeholder="タスクを入力...">
          <input type="date" id="todo-date">
          <select id="todo-subject">
            <option value="国語">国語</option>
            <option value="数学">数学</option>
            <option value="英語">英語</option>
            <option value="理科">理科</option>
            <option value="社会">社会</option>
            <option value="その他">その他</option>
          </select>
          <button onclick="addTodo()" class="add-btn">追加</button>
        </div>
        <div class="todo-columns" id="todo-list">
        </div>
      </section>

      <section class="panel calendar-panel">
        <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=1&bgcolor=%23ffffff&ctz=Asia%2FTokyo&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=1&showCalendars=0&showTz=0&mode=AGENDA" style="border-width:0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
      </section>

      <section class="panel links-panel">
        <h2>Applications</h2>
        <div class="links-grid">
          <a href="https://hajime-study.github.io/target1900/" target="_blank" class="link-item study">はじめ1900</a>
          <a href="https://learn.studysapuri.jp/ja/login" target="_blank" class="link-item study">スタサプ</a>
          <a href="https://member.studying.jp/" target="_blank" class="link-item study">STUDYing</a>
          <a href="https://ja.duolingo.com/" target="_blank" class="link-item study">Duolingo</a>
          <a href="https://www.aozora.gr.jp/" target="_blank" class="link-item study">青空文庫</a>
          
          <a href="https://gemini.google.com/app" target="_blank" class="link-item tool">Gemini</a>
          <a href="https://mail.google.com/" target="_blank" class="link-item tool">Gmail</a>
          <a href="https://drive.google.com/" target="_blank" class="link-item tool">Googleドライブ</a>
          <a href="https://calendar.google.com/calendar" target="_blank" class="link-item tool">Googleカレンダー</a>
          
          <a href="https://www.youtube.com/" target="_blank" class="link-item media">YouTube</a>
          <a href="https://abema.tv/" target="_blank" class="link-item media">ABEMA</a>
          <a href="https://www.instagram.com/?hl=ja" target="_blank" class="link-item media">Instagram</a>
          <a href="https://account.line.biz/login..." target="_blank" class="link-item media">LINE公式</a>
          <a href="https://awakest.net/youtube-video-downloader/" target="_blank" class="link-item media">YouTube保存</a>
          
          <a href="https://ebwebreserve4.tackport.co.jp/eboothweb_akss/areainfo/login" target="_blank" class="link-item local">図書館 座席予約</a>
          <a href="https://www.akashi-lib.jp/WebOpac/webopac/usermenu.do" target="_blank" class="link-item local">図書館 利用紹介</a>
          
          <a href="https://github.com/login" target="_blank" class="link-item dev">GitHub</a>
          <a href="https://database-gilt.vercel.app/" target="_blank" class="link-item dev">データベース</a>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
