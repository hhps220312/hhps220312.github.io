<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro City Timepiece</title>
    
    <!-- Favicon and App Icons strictly set to icon.png -->
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" sizes="192x192" href="icon.png">
    <meta name="theme-color" content="#1a1a2e">

    <!-- Web font for the digital clock to give it a retro electronic vibe -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --sky-color: #0b0f1c; /* Default Night */
            --frame-color: #7b4b2a;
            --face-color: #9ea3a8;
            --inner-face: #4b5055;
            --digital-bg: #4a6fa5;
            --building-color: #111;
            --window-color: #fce883;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            overflow: hidden;
            background: var(--sky-color);
            transition: background 2s ease;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Celestial Bodies (Sun & Moon) */
        .celestial-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .celestial {
            position: absolute;
            border-radius: 50%;
            transition: all 1s linear;
            transform: translate(-50%, -50%);
        }

        #sun {
            width: 100px;
            height: 100px;
            background: #ffde00;
            box-shadow: 0 0 40px #ffde00, 0 0 80px #ff9900;
            display: none; /* Toggled by JS */
        }

        #moon {
            width: 80px;
            height: 80px;
            background: #fffdf2;
            box-shadow: 0 0 20px #fffdf2, 0 0 40px #e0e0d0;
            display: block; /* Toggled by JS */
        }

        /* Stars Background */
        #stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 1;
            transition: opacity 2s ease;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite alternate ease-in-out;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Cityscape Silhouette */
        .city-scape {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35vh;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            z-index: 5;
            pointer-events: none;
        }

        .building {
            background: var(--building-color);
            width: 8%;
            border-top: 4px solid #000;
            border-left: 2px solid #000;
            border-right: 2px solid #000;
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            padding: 5px;
            gap: 4px;
        }

        .window {
            background: #222; /* Default unlit */
            height: 4px;
            width: calc(50% - 2px);
            margin-bottom: 6px;
        }

        .window.lit {
            background: var(--window-color);
            box-shadow: 0 0 5px var(--window-color);
        }

        /* Rooftop lights */
        .roof-light {
            position: absolute;
            top: -6px;
            width: 6px;
            height: 6px;
            background: #ff3333;
            border-radius: 50%;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.3; }
        }

        /* Clocks Container */
        .time-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: -10vh; /* Shift up slightly from center */
        }

        /* Analog Clock */
        .analog-frame {
            width: 320px;
            height: 320px;
            background: var(--frame-color);
            border: 6px solid #4a2a10;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.5);
        }

        .analog-face {
            width: 280px;
            height: 280px;
            background: var(--face-color);
            border-radius: 50%;
            position: relative;
            border: 4px solid #7c8186;
        }

        .analog-inner {
            width: 180px;
            height: 180px;
            background: var(--inner-face);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid #3a3f44;
        }

        /* Clock Numbers & Markers */
        .number {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #222;
            width: 30px;
            height: 30px;
            text-align: center;
            line-height: 30px;
            top: 50%;
            left: 50%;
            margin-top: -15px;
            margin-left: -15px;
        }

        .marker {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #d48c46;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            margin-top: -6px;
            margin-left: -6px;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        /* Clock Hands */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
            z-index: 10;
        }

        .hour-hand {
            width: 10px;
            height: 65px;
            background: #000;
            margin-left: -5px;
            border: 2px solid white;
        }

        .minute-hand {
            width: 8px;
            height: 95px;
            background: #fff;
            margin-left: -4px;
            border: 2px solid #000;
        }

        .second-hand {
            width: 4px;
            height: 105px;
            background: #ff3b30;
            margin-left: -2px;
            border-radius: 2px;
            z-index: 11;
        }

        .center-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #222;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 12;
            border: 3px solid #fff;
        }

        /* Digital Clock */
        .digital-clock {
            background: var(--digital-bg);
            border: 6px solid #2a4065;
            padding: 10px 30px;
            border-radius: 8px;
            font-family: 'VT323', monospace;
            font-size: 72px;
            color: #fff;
            letter-spacing: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 0 15px rgba(0,0,0,0.3);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            min-width: 260px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .analog-frame {
                width: 260px;
                height: 260px;
            }
            .analog-face {
                width: 220px;
                height: 220px;
            }
            .analog-inner {
                width: 140px;
                height: 140px;
            }
            .number { font-size: 20px; }
            .hour-hand { height: 50px; }
            .minute-hand { height: 75px; }
            .second-hand { height: 85px; }
            .digital-clock { font-size: 56px; padding: 5px 20px; min-width: 200px; }
        }
    </style>
</head>
<body>

    <!-- Stars for Night -->
    <div id="stars"></div>

    <!-- Moving Sun/Moon -->
    <div class="celestial-container">
        <div id="sun" class="celestial"></div>
        <div id="moon" class="celestial"></div>
    </div>

    <!-- Clock UI -->
    <div class="time-container">
        <div class="analog-frame">
            <div class="analog-face" id="clock-face">
                <div class="analog-inner"></div>
                <!-- Numbers and Markers injected by JS -->
                
                <div class="hand hour-hand" id="hour-hand"></div>
                <div class="hand minute-hand" id="minute-hand"></div>
                <div class="hand second-hand" id="second-hand"></div>
                <div class="center-dot"></div>
            </div>
        </div>
        <div class="digital-clock" id="digital-clock">00:00</div>
    </div>

    <!-- City Skyline -->
    <div class="city-scape" id="city">
        <!-- Buildings injected by JS -->
    </div>

    <script>
        // Setup Clock Face Numbers & Markers
        const face = document.getElementById('clock-face');
        const faceRadius = 120; // approximate placement radius
        
        for (let i = 1; i <= 12; i++) {
            // Draw Numbers (12, 1, 2, 3... at specific angles)
            const angle = i * 30 * (Math.PI / 180);
            const num = document.createElement('div');
            num.className = 'number';
            num.innerText = i;
            
            const x = Math.sin(angle) * (faceRadius + 5);
            const y = -Math.cos(angle) * (faceRadius + 5);
            
            num.style.transform = `translate(${x}px, ${y}px)`;
            face.appendChild(num);

            // Draw Orange Markers
            const marker = document.createElement('div');
            marker.className = 'marker';
            const mX = Math.sin(angle) * (faceRadius - 25);
            const mY = -Math.cos(angle) * (faceRadius - 25);
            marker.style.transform = `translate(${mX}px, ${mY}px)`;
            face.appendChild(marker);
        }

        // Setup Cityscape
        const city = document.getElementById('city');
        const buildingCount = 12;
        for (let i = 0; i < buildingCount; i++) {
            const b = document.createElement('div');
            b.className = 'building';
            
            // Randomize building height slightly
            const h = 40 + Math.random() * 60;
            b.style.height = `${h}%`;
            
            // Sometimes add a red roof light
            if (Math.random() > 0.5) {
                const light = document.createElement('div');
                light.className = 'roof-light';
                light.style.left = (Math.random() > 0.5) ? '0' : 'calc(100% - 6px)';
                b.appendChild(light);
            }

            // Add windows
            const windowCount = Math.floor(h / 5);
            for(let w=0; w < windowCount; w++) {
                const win = document.createElement('div');
                win.className = 'window';
                // Randomly lit window
                if(Math.random() > 0.6) win.classList.add('lit');
                b.appendChild(win);
            }
            
            city.appendChild(b);
        }

        // Setup Stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = star.style.height = (Math.random() * 3 + 1) + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 70 + '%'; // Keep stars mostly in upper sky
            star.style.setProperty('--duration', (Math.random() * 2 + 1) + 's');
            starsContainer.appendChild(star);
        }

        // Clock & Environment Logic
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const secondHand = document.getElementById('second-hand');
        const digitalClock = document.getElementById('digital-clock');
        const sun = document.getElementById('sun');
        const moon = document.getElementById('moon');

        function updateEnvironment(hour, minute) {
            const timeFloat = hour + minute / 60;
            
            // Sky colors mapping
            let bgStr = '';
            let showStars = false;

            if (timeFloat >= 5 && timeFloat < 7) {
                // Dawn
                bgStr = 'linear-gradient(to bottom, #4a6fa5, #d48c46)';
            } else if (timeFloat >= 7 && timeFloat < 16) {
                // Day
                bgStr = '#3388ff'; // bright sky blue
            } else if (timeFloat >= 16 && timeFloat < 19) {
                // Dusk/Evening
                bgStr = 'linear-gradient(to bottom, #d86820, #2a1a3e)';
            } else {
                // Night
                bgStr = '#0b0f1c';
                showStars = true;
            }
            
            document.body.style.background = bgStr;
            starsContainer.style.opacity = showStars ? 1 : 0;

            // Celestial Path Calculation (Arc over screen)
            const cw = window.innerWidth;
            const ch = window.innerHeight;
            const radiusX = cw / 2;
            const radiusY = ch * 0.6; // Arch height
            
            if (timeFloat >= 6 && timeFloat < 18) {
                // Sun is up
                sun.style.display = 'block';
                moon.style.display = 'none';
                
                // Map 6:00 - 18:00 to 0 - PI (0 to 180 degrees)
                const progress = (timeFloat - 6) / 12;
                const angle = Math.PI - (progress * Math.PI); // Start right, go left
                
                const x = (cw / 2) + Math.cos(angle) * radiusX;
                const y = ch - (Math.sin(angle) * radiusY);
                
                sun.style.left = `${x}px`;
                sun.style.top = `${y}px`;
                
            } else {
                // Moon is up
                sun.style.display = 'none';
                moon.style.display = 'block';
                
                // Map 18:00 - 6:00 to 0 - PI
                let moonTime = timeFloat;
                if (moonTime < 6) moonTime += 24; // Treat 0-6 as 24-30 for math
                
                const progress = (moonTime - 18) / 12;
                const angle = Math.PI - (progress * Math.PI);
                
                const x = (cw / 2) + Math.cos(angle) * radiusX;
                const y = ch - (Math.sin(angle) * radiusY);
                
                moon.style.left = `${x}px`;
                moon.style.top = `${y}px`;
            }
        }

        function updateClock() {
            const now = new Date();
            
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // Smooth hand rotation calculations
            const secAngle = (seconds + milliseconds / 1000) * 6; // 360 / 60
            const minAngle = (minutes + seconds / 60) * 6;
            const hrAngle = ((hours % 12) + minutes / 60) * 30; // 360 / 12

            secondHand.style.transform = `rotate(${secAngle}deg)`;
            minuteHand.style.transform = `rotate(${minAngle}deg)`;
            hourHand.style.transform = `rotate(${hrAngle}deg)`;

            // Digital format (HH:MM)
            const formattedHrs = hours.toString().padStart(2, '0');
            const formattedMins = minutes.toString().padStart(2, '0');
            
            // Blink colon every second
            const colon = seconds % 2 === 0 ? ':' : ' ';
            digitalClock.innerText = `${formattedHrs}${colon}${formattedMins}`;

            // Update environment based on time (optimize to only calculate when minute changes, but fine for requestAnimationFrame too)
            updateEnvironment(hours, minutes);

            requestAnimationFrame(updateClock);
        }

        // Initialize and start loop
        updateClock();

        // Handle window resize to recalculate sun/moon path gracefully
        window.addEventListener('resize', () => {
            const now = new Date();
            updateEnvironment(now.getHours(), now.getMinutes());
        });

    </script>
</body>
</html>
